apply plugin: 'com.android.application'

// versionCode = number of commits on HEAD, so every new build can be
// installed over the previous one (Android refuses downgrades).
def gitCommitCount = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
    workingDir rootDir
    ignoreExitValue true
}.standardOutput.asText.get().trim()
def appVersionCode = gitCommitCount.isInteger() ? gitCommitCount.toInteger() : 1

// Release key lives outside the repo (~/nbody-release.jks, NBODY_* entries in
// ~/.gradle/gradle.properties). It must never change: Android only updates an
// app in place when the new APK is signed with the same key.
def releaseStoreFile = providers.gradleProperty('NBODY_STORE_FILE').orNull

android {
    namespace 'com.nbody.touch'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId "com.nbody.touch"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName "1.${appVersionCode}"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.31.6'
        }
    }

    if (releaseStoreFile != null) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword providers.gradleProperty('NBODY_STORE_PASSWORD').get()
                keyAlias providers.gradleProperty('NBODY_KEY_ALIAS').get()
                keyPassword providers.gradleProperty('NBODY_KEY_PASSWORD').get()
            }
        }
    } else {
        logger.warn('NBODY_STORE_FILE not set: release APK will be unsigned')
    }

    buildTypes {
        // Debug builds use the release key too, so debug and release APKs
        // can replace each other on the phone without an uninstall.
        debug {
            if (releaseStoreFile != null) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            if (releaseStoreFile != null) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
